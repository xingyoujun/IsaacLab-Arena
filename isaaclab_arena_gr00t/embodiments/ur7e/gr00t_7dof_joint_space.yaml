# Policy state/action layout: [arm (6), gripper (1)]. The Robotiq mimic joints are passive and not exported.
joints:
  arm:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
  gripper:
    - finger_joint
