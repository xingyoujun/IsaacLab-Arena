# pine_wm cuMotion description derived from ur7e_robotiq.yaml.
#
# Arm collision spheres are copied from the Lula description generated for the real workcell
# (/home/ubuntu/playground/rr_ur/ur7e_usd/ur7e_gripper/ur7e_gripper.yaml); its gripper spheres were keyed by USD
# prim paths that do not exist in the URDF. The gripper spheres are on pine_wm_gripper_base,
